name: Pipeline CI/CD DevOps

on:
  push:
    branches:
      - main
      - develop
      - "hotfix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: CONSTRUCCIÓN Y PRUEBAS
  # ==========================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.15.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r requirements-dev.lock

      - name: Ejecutar pruebas y medir cobertura
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Guardar informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Construir imagen Docker
        run: docker compose build api

  # ==========================================
  # JOB 2: SEGURIDAD
  # ==========================================

  security-scan:
    name: Security Scan
    needs: build-and-test
    runs-on: ubuntu-22.04

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.15.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r requirements-dev.lock

      - name: Analizar código con Bandit
        run: bandit -r src/

  # ==========================================
  # JOB 4: SONARCLOUD
  # ==========================================

  sonarcloud:
    name: SonarCloud Analysis
    needs: build-and-test
    runs-on: ubuntu-22.04

    # El plan gratuito permite analizar main y PR hacia main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar informe de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Analizar código y verificar Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ==========================================
  # JOB 3: SIMULACIÓN DE DESPLIEGUE
  # ==========================================

  deploy-simulation:
    name: Deploy Simulation
    needs: [security-scan, sonarcloud]
    runs-on: ubuntu-22.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Construir y levantar contenedor
        run: |
          docker compose up -d --build --wait --wait-timeout 120

      - name: Mostrar estado de contenedores
        run: docker compose ps

      - name: Mostrar imágenes construidas
        run: docker compose images

      - name: Mostrar logs si falla el despliegue
        if: failure()
        run: docker compose logs --no-color

      - name: Limpiar contenedores
        if: always()
        run: docker compose down
