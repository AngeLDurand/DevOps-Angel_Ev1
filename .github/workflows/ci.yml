name: Pipeline CI/CD DevOps

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Unitarias (IE2)
      run: |
        pytest tests/

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    # Simulamos un análisis de seguridad básico para cumplir con el IE3
    - name: Escaneo de Seguridad básico (Safety)
      run: |
        pip install safety
        safety check -r requirements.txt || echo "Solo advertencia, no bloqueamos el pipeline por ahora"

  deploy-simulation:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Solo despliega si es la rama main
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Simular Despliegue con Docker Compose (IE4 e IE5)
      run: |
        echo "Iniciando despliegue automatizado..."
        docker-compose up -d --build
        echo "Validando que el contenedor esté corriendo..."
        docker ps
        echo "Despliegue exitoso."