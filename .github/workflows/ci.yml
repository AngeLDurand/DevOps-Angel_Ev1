name: Pipeline CI/CD DevOps

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Unitarias (IE2)
      env:
        PYTHONPATH: .
      run: |
        pytest tests/

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-22.04
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Escaneo de Seguridad básico (Safety)
      run: |
        pip install safety
        safety check -r requirements.txt || echo "Solo advertencia, no bloqueamos el pipeline por ahora"

  deploy-simulation:
    needs: security-scan
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Simular Despliegue con Docker Compose (IE4 e IE5)
      run: |
        echo "Iniciando despliegue automatizado..."
        docker compose up -d --build
        echo "Validando que el contenedor esté corriendo..."
        docker ps
        echo "Despliegue exitoso."