name: Pipeline CI/CD DevOps

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar Pruebas Unitarias y Cobertura
        env:
          PYTHONPATH: .
        run: pytest --cov=src tests/ --cov-report=xml

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar escáner de seguridad
        run: pip install bandit
      - name: Análisis de Seguridad con Bandit
        run: bandit -r src/ --skip B101

  deploy-simulation:
    needs: security-scan
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
      - name: Simular Despliegue con Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Iniciando despliegue automatizado para el commit $IMAGE_TAG..."
          docker compose up -d --build
          echo "Validando que los contenedores estén corriendo..."
          docker ps
          echo "Despliegue exitoso."