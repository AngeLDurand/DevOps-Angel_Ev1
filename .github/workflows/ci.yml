name: Pipeline CI/CD DevOps

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Unitarias (IE2)
      env:
        PYTHONPATH: .
      run: |
        pytest tests/

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-22.04
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarQube Scan (IE3)
      uses: SonarSource/sonarqube-scan-action@bf55047805174301d2c676239121be5e87a55420
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
      with:
        args: >
          -Dsonar.projectKey=AngelDurand_DevOps-Angel_Ev1
          -Dsonar.organization=angeldurand

  deploy-simulation:
    needs: security-scan
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Simular Despliegue con Docker Compose (IE4 e IE5)
      run: |
        echo "Iniciando despliegue automatizado..."
        docker compose up -d --build
        echo "Validando que el contenedor esté corriendo..."
        docker ps
        echo "Despliegue exitoso."
