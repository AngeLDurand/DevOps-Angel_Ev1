# Identificación del proyecto
sonar.projectKey=AngeLDurand_DevOps-Angel_Ev1
sonar.organization=angeldurand
sonar.host.url=https://sonarcloud.io

# Analizar los archivos del repositorio
sonar.sources=.

# Identificar las pruebas por separado
sonar.tests=tests

# Excluir las pruebas del análisis de código de producción
sonar.exclusions=tests/**

# Versión del lenguaje
sonar.python.version=3.15

# Cobertura de pytest
sonar.python.coverage.reportPaths=coverage.xml