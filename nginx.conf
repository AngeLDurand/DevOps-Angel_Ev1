events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Grupo de contenedores FastAPI
    upstream fastapi_backend {
        zone fastapi_backend 64k;
        server api:8000 resolve;
    }

    # Registrar qué contenedor atiende cada solicitud
    log_format upstream_log '$remote_addr "$request" '
                            'status=$status upstream=$upstream_addr';

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}