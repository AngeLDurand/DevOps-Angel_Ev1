services:
  api:
    build: .
    image: fastapi_devops:${IMAGE_TAG:-latest}

    expose:
      - "8000"

    environment:
      - ENVIRONMENT=production

    restart: unless-stopped

    deploy:
      replicas: 2

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  proxy:
    image: nginx:1.30.8-alpine

    ports:
      - "127.0.0.1:8000:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
